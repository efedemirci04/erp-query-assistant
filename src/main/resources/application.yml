spring:
  application:
    name: erp-query-assistant
  datasource:
    url: jdbc:postgresql://localhost:5432/erp
    username: ${DB_USER:erp_admin}
    password: ${DB_PASSWORD:erp_admin_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
