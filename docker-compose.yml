services:
  postgres:
    image: postgres:17-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: erp_admin_dev
    ports:
      - "5432:5432"
    volumes:
      - erp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_admin -d erp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  erp-data:
